[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cail2025-reft"
version = "0.1.0"
description = "JEC-QA instruction filtering, QLoRA SFT and GRPO"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
train = ["torch>=2.6,<2.8", "transformers==4.51.3", "peft==0.15.2", "datasets==3.6.0", "accelerate==1.6.0", "bitsandbytes==0.45.5", "safetensors>=0.5"]

[project.scripts]
cail = "cail.cli:main"

[tool.setuptools.packages.find]
include = ["cail*"]
